<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>

        body{
            font-family:Arial;
            background:#f1f5f9;
            padding:40px;
        }

        .box{
            background:white;
            padding:20px;
            border-radius:10px;
            width:300px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:#2563eb;
            color:white;
            border:none;
        }

    </style>
</head>

<body>

<div class="box">

<h2>✏ Edit Student</h2>

<form method="POST">

<input name="name" value="{{student[1]}}">

<input name="age" value="{{student[2]}}">

<input name="grade" value="{{student[3]}}">

<button>Update</button>

</form>

</div>

</body>
</html>
