<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.box{
background:white;
padding:30px;
border-radius:10px;
width:300px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-top:10px;
}

button{
width:100%;
padding:10px;
margin-top:15px;
background:#2563eb;
color:white;
border:none;
}

</style>
</head>

<body>

<div class="box">

<h2>🔐 Login</h2>

<form method="POST">

<input name="username" placeholder="Username">

<input type="password" name="password" placeholder="Password">

<button>Login</button>

</form>

<p>admin / 1234</p>

</div>

</body>
</html>
