<!DOCTYPE html>
<html>
<head>
    <title>Attendance Pro System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card p-3 shadow">

        <h3>📊 Attendance Pro System</h3>

        <a href="/dashboard" class="btn btn-primary mt-2">
            ⬅ Back
        </a>

        <form method="GET" class="row g-2 mt-3">

            <div class="col-md-3">
                <input type="date" name="date" class="form-control">
            </div>

            <div class="col-md-3">
                <input type="text" name="student" placeholder="Student Name" class="form-control">
            </div>

            <div class="col-md-3">
                <select name="status" class="form-control">
                    <option value="">All</option>
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Late">Late</option>
                </select>
            </div>

            <div class="col-md-3">
                <button class="btn btn-success w-100">
                    🔍 Filter
                </button>
            </div>

        </form>

    </div>

    <div class="card mt-3 p-3 shadow">

        <div class="table-responsive">

            <table class="table table-bordered table-striped">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody>

                {% for row in data %}

                <tr>
                    <td>{{ row[0] }}</td>
                    <td>{{ row[1] }}</td>

                    <td>
                        {% if row[2]=='Present' %}
                            <span class="badge bg-success">🟢 Present</span>
                        {% elif row[2]=='Absent' %}
                            <span class="badge bg-danger">🔴 Absent</span>
                        {% else %}
                            <span class="badge bg-warning text-dark">🟡 Late</span>
                        {% endif %}
                    </td>

                    <td>{{ row[3] }}</td>
                </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
