<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
</head>
<body>

<h2>Attendance System</h2>

<form method="POST">

    <input
        type="text"
        name="student_name"
        placeholder="Student Name"
        required>

    <select name="status">
        <option value="Present">Present</option>
        <option value="Absent">Absent</option>
    </select>

    <input
        type="date"
        name="date"
        required>

    <button type="submit">
        Save Attendance
    </button>

</form>

<hr>

<a href="/attendance_report">
    View Report
</a>

<table border="1">

<tr>
    <th>Name</th>
    <th>Status</th>
    <th>Date</th>
</tr>

{% for r in records %}
<tr>
    <td>{{ r.student_name }}</td>
    <td>{{ r.status }}</td>
    <td>{{ r.date }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
