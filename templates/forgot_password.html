<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>

<body style="font-family:Arial;background:#f4f4f4;">

<div style="width:300px;margin:100px auto;background:white;padding:20px;border-radius:10px;">

    <h2>Forgot Password</h2>

    <form method="POST">

        <input name="username" placeholder="Username"
               style="width:100%;padding:10px;margin:5px 0;">

        <input name="new_password" type="password" placeholder="New Password"
               style="width:100%;padding:10px;margin:5px 0;">

        <button style="width:100%;padding:10px;background:blue;color:white;border:none;">
            Reset Password
        </button>

    </form>

</div>

</body>
</html>
