<!DOCTYPE html>
<html>
<head>
    <title>Edit Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h3>✏ Edit Exam</h3>

    <form method="POST">

        <input type="text"
               name="subject"
               value="{{ exam[2] }}"
               class="form-control mb-2">

        <input type="text"
               name="exam_name"
               value="{{ exam[3] }}"
               class="form-control mb-2">

        <input type="number"
               step="0.01"
               name="score"
               value="{{ exam[4] }}"
               class="form-control mb-2">

        <input type="number"
               step="0.01"
               name="total"
               value="{{ exam[5] }}"
               class="form-control mb-2">

        <button class="btn btn-success">
            Save Changes
        </button>

    </form>

</div>

</body>
</html>
