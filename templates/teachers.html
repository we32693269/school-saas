<!DOCTYPE html>
<html>
<head>
    <title>Teachers Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .card{
            border:none;
            border-radius:15px;
        }

        table{
            background:white;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="card shadow p-3 mb-3">
        <h3>👨‍🏫 Teachers Management</h3>
        <a href="/dashboard" class="btn btn-primary btn-sm w-25">⬅ Back</a>
    </div>

    <!-- ADD FORM -->
    <div class="card shadow p-3 mb-3">

        <h5>➕ Add Teacher</h5>

        <form method="POST" action="/add_teacher">

            <div class="row g-2">

                <div class="col-md-3">
                    <input type="text" name="name" class="form-control" placeholder="Name" required>
                </div>

                <div class="col-md-3">
                    <input type="text" name="subject" class="form-control" placeholder="Subject" required>
                </div>

                <div class="col-md-3">
                    <input type="text" name="phone" class="form-control" placeholder="Phone" required>
                </div>

                <div class="col-md-2">
                    <input type="number" name="salary" class="form-control" placeholder="Salary" required>
                </div>

                <div class="col-md-1">
                    <button class="btn btn-success w-100">Add</button>
                </div>

            </div>
            <select onchange="if(this.value) location=this.value">

    <option value="">Attendance</option>

    <option value="/mark_teacher_attendance/{{ t[0] }}/Present">
        Present
    </option>

    <option value="/mark_teacher_attendance/{{ t[0] }}/Absent">
        Absent
    </option>

</select>
            

        </form>

    </div>

    <!-- TABLE -->
    <div class="card shadow p-3">

        <h5>📋 Teachers List</h5>

        <div class="table-responsive">

            <table class="table table-bordered table-striped">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>Phone</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                {% for t in teachers %}
                <tr>
                    <td>{{ t[0] }}</td>
                    <td>{{ t[1] }}</td>
                    <td>{{ t[2] }}</td>
                    <td>{{ t[3] }}</td>
                    <td>{{ t[4] }}</td>

                    <td>
                        <a href="/edit_teacher/{{ t[0] }}" class="btn btn-primary btn-sm">Edit</a>
                        <a href="/delete_teacher/{{ t[0] }}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this teacher?')">
                           Delete
                        </a>
                    </td>

                </tr>
                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
