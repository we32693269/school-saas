<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h3 class="text-center mb-4">✏️ Edit Student</h3>

        <form method="POST">

            <!-- NAME -->
            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="name" value="{{ student[1] }}" class="form-control" required>
            </div>

            <!-- AGE -->
            <div class="mb-3">
                <label>Age</label>
                <input type="number" name="age" value="{{ student[2] }}" class="form-control" required>
            </div>

            <!-- GRADE -->
            <div class="mb-3">
                <label>Grade</label>
                <input type="text" name="grade" value="{{ student[3] }}" class="form-control" required>
            </div>

            <!-- FEE -->
            <div class="mb-3">
                <label>Fee</label>
                <input type="number" name="fee" value="{{ student[4] }}" class="form-control" required>
            </div>

            <!-- PAID -->
            <div class="mb-3">
                <label>Paid</label>
                <input type="number" name="paid" value="{{ student[5] }}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Update Student
            </button>

        </form>

    </div>

</div>

</body>
</html>
