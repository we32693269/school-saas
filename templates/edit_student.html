<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">✏️ Edit Student</h3>
                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input
                                type="text"
                                name="name"
                                value="{{ student[1] }}"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input
                                type="number"
                                name="age"
                                value="{{ student[2] }}"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">School Fee</label>
                            <input
                                type="number"
                                name="fee"
                                value="{{ student[3] }}"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Amount Paid</label>
                            <input
                                type="number"
                                name="paid"
                                value="{{ student[4] }}"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Attendance Status</label>

                            <select name="status" class="form-select">

                                <option value="Present"
                                    {% if student[5] == 'Present' %}selected{% endif %}>
                                    🟢 Present
                                </option>

                                <option value="Absent"
                                    {% if student[5] == 'Absent' %}selected{% endif %}>
                                    🔴 Absent
                                </option>

                                <option value="Late"
                                    {% if student[5] == 'Late' %}selected{% endif %}>
                                    🟡 Late
                                </option>

                            </select>
                        </div>

                        <button type="submit" class="btn btn-success">
                            💾 Update Student
                        </button>

                        <a href="/dashboard" class="btn btn-secondary">
                            ⬅ Back
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
