<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f6f9;
            padding:40px;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:10px;
            width:400px;
            margin:auto;
        }

        input, select{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:12px;
            background:#2c3e50;
            color:white;
            border:none;
        }
    </style>
</head>
<body>

<div class="box">

<h2>Edit Student</h2>

<form action="/update/{{ student.id }}" method="post">

<input name="name" value="{{ student.name }}">

<input name="age" value="{{ student.age }}">

<input name="grade" value="{{ student.grade }}">

<select name="gender">
    <option>{{ student.gender }}</option>
    <option>Male</option>
    <option>Female</option>
</select>

<input name="phone" value="{{ student.phone }}">

<input name="address" value="{{ student.address }}">

<button>Update Student</button>

</form>

</div>

</body>
</html>
