<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2>✏️ Edit Student</h2>

        <form method="POST">

            <input name="name"
                   class="form-control mb-2"
                   value="{{ student.name }}"
                   placeholder="Name">

            <input name="age"
                   class="form-control mb-2"
                   value="{{ student.age }}"
                   placeholder="Age">

            <input name="grade"
                   class="form-control mb-2"
                   value="{{ student.grade }}"
                   placeholder="Grade">

            <select name="attendance" class="form-control mb-3">

                <option value="Present"
                    {% if student.attendance == "Present" %}selected{% endif %}>
                    Present
                </option>

                <option value="Absent"
                    {% if student.attendance == "Absent" %}selected{% endif %}>
                    Absent
                </option>

                <option value="Late"
                    {% if student.attendance == "Late" %}selected{% endif %}>
                    Late
                </option>

            </select>

            <button class="btn btn-success w-100">
                Save Changes
            </button>

        </form>

        <a href="/dashboard" class="btn btn-secondary mt-3 w-100">
            Back
        </a>

    </div>

</div>

</body>
</html>
