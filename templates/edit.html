<!DOCTYPE html>
<html>
<head>
    <title>Edit</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h3 class="text-center mb-3">✏️ Edit Data</h3>

                <form method="post">

                    <label>Name</label>
                    <input class="form-control mb-3" name="name" value="{{name}}" required>

                    <label>Second Field (Grade / Subject)</label>
                    <input class="form-control mb-3" name="field2" value="{{field2}}" required>

                    <button class="btn btn-primary w-100">Update</button>

                </form>

                <br>

                <a href="{{back_url}}" class="btn btn-secondary w-100">⬅ Back</a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
