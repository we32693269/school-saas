<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

<h2>Edit Student</h2>

<form method="POST">

    <input
        type="text"
        name="name"
        value="{{ student.name }}"
        required
    >

    <input
        type="text"
        name="age"
        value="{{ student.age }}"
        required
    >

    <input
        type="text"
        name="grade"
        value="{{ student.grade }}"
        required
    >

    <button type="submit">
        Update
    </button>

</form>

</body>
</html>
