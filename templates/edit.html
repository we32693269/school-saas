<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>

<body>

<h1>Edit Student</h1>

<form method="POST">

    <input type="text"
           name="name"
           value="{{ student[1] }}"
           required>

    <br><br>

    <input type="text"
           name="age"
           value="{{ student[2] }}"
           required>

    <br><br>

    <input type="text"
           name="grade"
           value="{{ student[3] }}"
           required>

    <br><br>

    <input type="text"
           name="gender"
           value="{{ student[4] }}"
           required>

    <br><br>

    <input type="text"
           name="phone"
           value="{{ student[5] }}"
           required>

    <br><br>

    <input type="text"
           name="address"
           value="{{ student[6] }}"
           required>

    <br><br>

    <button type="submit">
        Update Student
    </button>

</form>

<br>

<a href="/dashboard">
    Back To Dashboard
</a>

</body>
</html>
