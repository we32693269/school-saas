<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card p-4 shadow-sm">

        <h2 class="text-primary mb-4">
            ✏ Edit Student
        </h2>

        <form action="/update/{{ student[0] }}" method="POST">

            <div class="mb-3">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ student[1] }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label>Age</label>

                <input
                    type="text"
                    name="age"
                    class="form-control"
                    value="{{ student[2] }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label>Grade</label>

                <input
                    type="text"
                    name="grade"
                    class="form-control"
                    value="{{ student[3] }}"
                    required
                >

            </div>

            <button class="btn btn-success">
                Update Student
            </button>

            <a href="/dashboard" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
