<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

<h2>Edit Student</h2>

<form method="POST">

    <input type="text"
           name="name"
           value="{{ student.name }}"
           required>

    <br><br>

    <input type="text"
           name="age"
           value="{{ student.age }}"
           required>

    <br><br>

    <input type="text"
           name="grade"
           value="{{ student.grade }}"
           required>

    <br><br>

    <button type="submit">
        Update Student
    </button>

</form>

<br>

<a href="/dashboard">
    Back Dashboard
</a>

</body>
</html>
