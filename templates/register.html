<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body style="font-family:Arial;background:#f4f6f8;">

<div style="width:300px;margin:100px auto;background:white;padding:20px;border-radius:10px;">

    <h2>Register</h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >
        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >
        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <br>

    <a href="/">Already have an account? Login</a>

</div>

</body>
</html>
