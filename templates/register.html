<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body{
            background:#f4f6f9;
            font-family:Arial;
        }

        .register-box{
            width:350px;
            background:white;
            margin:100px auto;
            padding:30px;
            border-radius:10px;
        }

        input, select{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:#2c3e50;
            color:white;
            border:none;
        }
    </style>
</head>
<body>

<div class="register-box">

<h2>Register</h2>

<form method="post">

<input name="username" placeholder="Username">

<input type="password" name="password" placeholder="Password">

<select name="role">
    <option>admin</option>
    <option>teacher</option>
    <option>student</option>
</select>

<button>Create Account</button>

</form>

<br>

<a href="/">Back to Login</a>

</div>

</body>
</html>
