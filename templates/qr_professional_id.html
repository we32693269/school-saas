<!DOCTYPE html>
<html>
<head>
<title>QR Professional ID Card</title>

<style>

body{
    background:#f0f2f5;
    font-family:Arial;
}

.card{
    width:350px;
    margin:30px auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

.header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:15px;
}

.content{
    text-align:center;
    padding:20px;
}

.photo{
    width:100px;
    height:100px;
    border-radius:50%;
    border:4px solid #0d6efd;
}

.qr{
    width:120px;
    margin-top:15px;
}

.info{
    margin-top:10px;
    font-size:18px;
}

</style>
</head>

<body>

<div class="card">

    <div class="header">
        <h2>MY SCHOOL</h2>
        <p>QR Professional ID Card</p>
    </div>

    <div class="content">

        <img src="/static/logo.png"
             width="80">

        <h3>{{ student[1] }}</h3>

        <div class="info">
            ID : {{ student[0] }}
        </div>

        <div class="info">
            Grade : {{ student[3] }}
        </div>

        <div class="info">
            Age : {{ student[2] }}
        </div>

        <hr>

        <img src="/static/logo.png"
             class="qr">

        <p>Scan QR Code</p>

    </div>

</div>

</body>
</html>
