<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body{
            font-family: Arial;
            background: linear-gradient(120deg, #2980b9, #6dd5fa);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .box{
            background:white;
            padding:30px;
            width:320px;
            border-radius:10px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }

        h2{
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:10px;
            background:#2980b9;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#1f6692;
        }

        a{
            display:block;
            margin-top:10px;
            text-decoration:none;
            color:#2980b9;
            font-size:14px;
        }

        a:hover{
            text-decoration:underline;
        }

        .register{
            margin-top:15px;
        }

    </style>
</head>

<body>

<div class="box">

    <h2>🔐 Login</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

    <!-- FORGOT PASSWORD -->
    <a href="/forgot_password">Forgot Password?</a>

    <!-- REGISTER LINK -->
    <div class="register">
        <a href="/register">Create Account</a>
    </div>

</div>

</body>
</html>
