<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#f4f6f9;">

<div class="container mt-4">

    <div class="card p-3 shadow">

        <h3>👨‍🏫 Teacher Dashboard</h3>

        <a href="/logout" class="btn btn-danger btn-sm float-end">
            Logout
        </a>

    </div>

    <br>

    <!-- STATS -->
    <div class="row">

        <div class="col-md-4">
            <div class="card p-3 bg-primary text-white">
                <h5>Total Students</h5>
                <h2>{{ total_students }}</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 bg-success text-white">
                <h5>Today Attendance</h5>
                <h2>{{ today_attendance }}</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 bg-warning">
                <h5>Teachers</h5>
                <h2>{{ teachers|length }}</h2>
            </div>
        </div>

    </div>

    <br>

    <!-- TEACHER LIST -->
    <div class="card p-3">

        <h4>👨‍🏫 Teachers List</h4>

        <table class="table table-bordered">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Subject</th>
                    <th>Phone</th>
                    <th>Salary</th>
                </tr>
            </thead>

            <tbody>

                {% for t in teachers %}
                <tr>
                    <td>{{ t[1] }}</td>
                    <td>{{ t[2] }}</td>
                    <td>{{ t[3] }}</td>
                    <td>{{ t[4] }}</td>
                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
