<!DOCTYPE html>
<html>
<head>
    <title>Fees System</title>

    <style>
        body {font-family:Arial; background:#f4f6fb; margin:0;}

        .container {
            margin-left:240px;
            padding:20px;
        }

        .card {
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
        }

        input, select {
            padding:10px;
            margin:5px;
            width:200px;
        }

        button {
            padding:10px 15px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:6px;
        }

        table {
            width:100%;
            background:white;
            border-collapse:collapse;
        }

        th, td {
            padding:10px;
            border-bottom:1px solid #ddd;
        }

        .btn {
            padding:5px 10px;
            background:green;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">
        <h2>💰 Fee Payment</h2>

        <form method="POST">
            <input name="student_name" placeholder="Student Name" required>
            <input name="amount" placeholder="Amount" required>

            <select name="status">
                <option>Paid</option>
                <option>Pending</option>
            </select>

            <button type="submit">Save</button>
        </form>
    </div>

    <div class="card">
        <h2>📊 Fees List</h2>

        <table>
            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            {% for f in fees %}
            <tr>
                <td>{{ f.id }}</td>
                <td>{{ f.student_name }}</td>
                <td>{{ f.amount }}</td>
                <td>{{ f.status }}</td>
                <td>
                    <a class="btn" href="/fee_receipt/{{ f.id }}">
                        📄 PDF
                    </a>
                </td>
            </tr>
            {% endfor %}

        </table>
    </div>

</div>

</body>
</html>
