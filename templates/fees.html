<!DOCTYPE html>
<html>
<head>

<title>Fees System</title>

<style>

body{
    font-family:Arial;
    background:#eef2f7;
    padding:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    background:#0f172a;
    color:white;
    padding:12px;
    width:100%;
    border:none;
    border-radius:10px;
}

table{
    width:100%;
    background:white;
    border-collapse:collapse;
}

th{
    background:#0f172a;
    color:white;
    padding:15px;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

.paid{
    color:green;
    font-weight:bold;
}

.unpaid{
    color:red;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<h2>💰 Add Fees</h2>

<form method="POST">

<input type="text" name="student_name" placeholder="Student Name" required>

<input type="number" name="amount" placeholder="Amount" required>

<select name="status">

<option value="Paid">Paid</option>

<option value="Unpaid">Unpaid</option>

</select>

<button type="submit">
Save Fees
</button>

</form>

</div>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Amount</th>
<th>Status</th>
</tr>

{% for fee in fees %}

<tr>

<td>{{ fee[0] }}</td>

<td>{{ fee[1] }}</td>

<td>{{ fee[2] }}</td>

<td>

{% if fee[3] == "Paid" %}

<span class="paid">
✅ Paid
</span>

{% else %}

<span class="unpaid">
❌ Unpaid
</span>

{% endif %}

</td>

</tr>

{% endfor %}

</table>

</body>
</html>
