<!DOCTYPE html>
<html>
<head>
    <title>Payment System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>💳 Payment System</h2>

    <!-- INFO CARD -->
    <div class="card p-3 mb-4 shadow">

        <h5>Select Student & Pay Fees</h5>

        <p>Click "Pay" button next to a student to open Stripe checkout.</p>

        <a href="/dashboard" class="btn btn-secondary">🏠 Back to Dashboard</a>

    </div>

    <!-- STUDENT LIST FOR PAYMENT -->
    <div class="card p-3 shadow">

        <h5>Students</h5>

        {% for s in students %}

        <div class="border p-2 mb-2 d-flex justify-content-between align-items-center">

            <div>
                <b>{{s[1]}}</b> - Grade: {{s[2]}}
            </div>

            <a class="btn btn-success btn-sm" href="/pay/{{s[0]}}">
                💳 Pay Fee
            </a>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
