<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">🏫 School System - Role: {{ role }}</span>
    <a class="btn btn-danger" href="/logout">Logout</a>
  </div>
</nav>

<div class="container mt-4">

  {% if role != "student" %}
  <div class="card p-3 mb-3">
    <h4>➕ Add Student</h4>

    <form method="POST">
      <input name="name" class="form-control mb-2" placeholder="Student Name">
      <button class="btn btn-success">Add</button>
    </form>
  </div>
  {% endif %}

  <div class="card p-3">
    <h4>📚 Students List</h4>

    <table class="table">
      <tr>
        <th>Name</th>
        {% if role == "admin" %}
        <th>Action</th>
        {% endif %}
      </tr>

      {% for s in students %}
      <tr>
        <td>{{ s }}</td>

        {% if role == "admin" %}
        <td>
          <a href="/delete/{{ s }}" class="btn btn-sm btn-danger">Delete</a>
        </td>
        {% endif %}

      </tr>
      {% endfor %}

    </table>
  </div>

</div>

</body>
</html>
