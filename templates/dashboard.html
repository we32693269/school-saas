<h2>Welcome {{ user }}</h2>
<a href="/logout">Logout</a>

<h3>Total Students: {{ total_students }}</h3>

<form action="/add" method="post">
<input name="name" placeholder="Name">
<input name="age" placeholder="Age">
<input name="grade" placeholder="Grade">
<button>Add</button>
</form>

<h3>Students</h3>

{% for s in students %}
<div>
{{ s[1] }} | {{ s[2] }} | {{ s[3] }}

<a href="/edit/{{ s[0] }}">Edit</a>
<a href="/delete/{{ s[0] }}">Delete</a>

<a href="/attendance/{{ s[0] }}/present">✔</a>
<a href="/attendance/{{ s[0] }}/absent">❌</a>
</div>
{% endfor %}

<h3>Attendance Chart</h3>
<canvas id="chart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const data = {{ attendance_data|tojson }};
const labels = data.map(x => x[0]);
const values = data.map(x => x[1]);

new Chart(document.getElementById("chart"), {
    type: "pie",
    data: {
        labels: labels,
        datasets: [{
            data: values
        }]
    }
});
</script>
