<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>

        body{
            font-family: Arial;
            background:#f1f5f9;
            padding:20px;
        }

        h1{
            text-align:center;
        }

        .cards{
            display:flex;
            gap:20px;
            justify-content:center;
            margin-bottom:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            width:200px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:20px;
            border-radius:5px;
            border:1px solid #ccc;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#0f172a;
            color:white;
            padding:10px;
        }

        td{
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
        }

        a{
            text-decoration:none;
            padding:5px 10px;
            background:#0f172a;
            color:white;
            border-radius:5px;
        }

    </style>
</head>

<body>

<h1>Dashboard</h1>

<!-- CARDS -->
<div class="cards">

    <div class="card">
        <h2>{{ total_students }}</h2>
        <p>Total Students</p>
    </div>

    <div class="card">
        <h2>{{ total_attendance }}</h2>
        <p>Total Attendance</p>
    </div>

</div>

<!-- SEARCH -->
<input type="text" id="search" placeholder="Search student...">

<!-- TABLE -->
<table id="table">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Grade</th>
    <th>Action</th>
</tr>

{% for s in students %}

<tr>
    <td>{{ s[0] }}</td>
    <td>{{ s[1] }}</td>
    <td>{{ s[2] }}</td>
    <td>{{ s[3] }}</td>
    <td>
        <a href="/edit/{{ s[0] }}">Edit</a>
        <a href="/delete/{{ s[0] }}">Delete</a>
    </td>
</tr>

{% endfor %}

</table>

<!-- SEARCH SCRIPT -->
<script>
document.getElementById("search").addEventListener("keyup", function(){

    let value = this.value.toLowerCase();
    let rows = document.querySelectorAll("#table tr");

    rows.forEach((row, index) => {

        if(index === 0) return;

        let text = row.innerText.toLowerCase();

        if(text.includes(value)){
            row.style.display = "";
        }else{
            row.style.display = "none";
        }

    });

});
</script>

</body>
</html>
