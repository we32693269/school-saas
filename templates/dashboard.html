{% extends "layout.html" %}

{% block content %}

<h2 class="mb-4">🏫 School SaaS Dashboard</h2>

<!-- STATS CARDS -->
<div class="row g-4">

    <div class="col-md-3">
        <div class="card text-white bg-primary shadow-lg p-3 rounded-4">
            <h6>👨‍🎓 Students</h6>
            <h2>{{students}}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-white bg-success shadow-lg p-3 rounded-4">
            <h6>👨‍🏫 Teachers</h6>
            <h2>{{teachers}}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-dark bg-warning shadow-lg p-3 rounded-4">
            <h6>📅 Attendance</h6>
            <h2>{{attendance}}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-white bg-danger shadow-lg p-3 rounded-4">
            <h6>💳 Payments</h6>
            <h2>{{payments}}</h2>
        </div>
    </div>

</div>

<hr>

<!-- MENU -->
<div class="row g-3">

    <div class="col-md-4">
        <a href="/students" class="btn btn-outline-primary w-100">👨‍🎓 Students</a>
    </div>

    <div class="col-md-4">
        <a href="/teachers" class="btn btn-outline-success w-100">👨‍🏫 Teachers</a>
    </div>

    <div class="col-md-4">
        <a href="/attendance_report" class="btn btn-outline-warning w-100">📅 Attendance</a>
    </div>

    <div class="col-md-4">
        <a href="/ranking" class="btn btn-outline-dark w-100">🏆 Ranking</a>
    </div>

    <div class="col-md-4">
        <a href="/payment" class="btn btn-outline-info w-100">💳 Payment System</a>
    </div>

    <div class="col-md-4">
        <a href="/payments" class="btn btn-outline-danger w-100">📋 Payments Report</a>
    </div>

</div>

<hr>

<a href="/logout" class="btn btn-secondary">🚪 Logout</a>

{% endblock %}
