<!DOCTYPE html><html>
<head>
    <title>Dashboard</title>
</head>
<body><h1>School Dashboard</h1><a href="/logout">Logout</a>

<hr><h2>Add Student</h2><form method="POST"><input
    type="text"
    name="name"
    placeholder="Student Name"
    required
>

<input
    type="text"
    name="age"
    placeholder="Age"
    required
>

<input
    type="text"
    name="grade"
    placeholder="Grade"
    required
>

<button type="submit">
    Add Student
</button>

</form><hr><h2>Students</h2><table border="1" cellpadding="10"><tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Grade</th>
    <th>Action</th>
</tr>{% for student in students %}

<tr><td>{{ student.id }}</td>
<td>{{ student.name }}</td>
<td>{{ student.age }}</td>
<td>{{ student.grade }}</td><td>
    <a href="/delete_student/{{ student.id }}">
        Delete
    </a>
</td></tr>{% endfor %}
{% for s in students %}
<tr>
    <td>{{ s.id }}</td>
    <td>{{ s.name }}</td>
    <td>{{ s.age }}</td>
    <td>{{ s.grade }}</td>

    <td>
        <a href="/edit/{{ s.id }}">Edit</a>
        <a href="/delete/{{ s.id }}">Delete</a>
    </td>
</tr>
{% endfor %}
</table></body>
</html>
