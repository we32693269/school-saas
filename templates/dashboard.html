<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body{font-family:Arial;background:#f4f6f8;}
        .card{background:white;padding:20px;margin:10px;border-radius:10px;}
        .btn{background:#2563eb;color:white;padding:6px 10px;border-radius:6px;text-decoration:none;}
        .btn-danger{background:red;}
        table{width:100%;border-collapse:collapse;}
        th,td{padding:10px;border:1px solid #ddd;text-align:center;}
    </style>
</head>

<body>

<div class="card">

<h2>Add Student</h2>

<form method="POST" enctype="multipart/form-data">
    <input name="name" placeholder="Name" required><br><br>
    <input name="age" placeholder="Age" required><br><br>
    <input name="grade" placeholder="Grade" required><br><br>
    <input type="file" name="photo"><br><br>
    <button type="submit">Add</button>
</form>

</div>


<div class="card">

<h2>Students List</h2>

<table>
<tr>
    <th>ID</th>
    <th>Photo</th>
    <th>Name</th>
    <th>Age</th>
    <th>Grade</th>
    <th>Actions</th>
</tr>

{% for student in students %}
<tr>

    <td>{{ student[0] }}</td>

    <td>
        {% if student[4] %}
        <img src="{{ url_for('static', filename='uploads/' + student[4]) }}" width="40">
        {% endif %}
    </td>

    <td>{{ student[1] }}</td>
    <td>{{ student[2] }}</td>
    <td>{{ student[3] }}</td>

    <td>
        <a href="/student/{{ student[0] }}" class="btn">Profile</a>
        <a href="/delete_student/{{ student[0] }}" class="btn btn-danger">Delete</a>
    </td>

</tr>
{% endfor %}

</table>

</div>

</body>
</html>
