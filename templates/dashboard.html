<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f6f9;
            padding:20px;
        }

        h1{
            text-align:center;
        }

        .cards{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-bottom:20px;
        }

        .card{
            background:white;
            padding:20px;
            width:200px;
            text-align:center;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .btn{
            display:inline-block;
            padding:8px 12px;
            margin:2px;
            text-decoration:none;
            color:white;
            border-radius:5px;
            font-size:12px;
        }

        .edit{ background:green; }
        .delete{ background:red; }
        .present{ background:blue; }
        .absent{ background:orange; }
        .pdf{ background:#0f172a; }

        input{
            width:100%;
            padding:10px;
            margin-bottom:15px;
            border-radius:5px;
            border:1px solid #ccc;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#0f172a;
            color:white;
            padding:10px;
        }

        td{
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }

    </style>
</head>

<body>

<h1>School Dashboard</h1>

<!-- PDF BUTTON -->
<div style="text-align:center;">
    <a class="btn pdf" href="/download_pdf">⬇ Download PDF Report</a>
</div>

<!-- CARDS -->
<div class="cards">

    <div class="card">
        <h2>{{ total_students }}</h2>
        <p>Total Students</p>
    </div>

    <div class="card">
        <h2>{{ total_attendance }}</h2>
        <p>Total Attendance</p>
    </div>

</div>

<!-- SEARCH -->
<input type="text" id="search" placeholder="Search student...">

<!-- TABLE -->
<table id="table">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Grade</th>
    <th>Action</th>
</tr>

{% for s in students %}

<tr>
    <td>{{ s[0] }}</td>
    <td>{{ s[1] }}</td>
    <td>{{ s[2] }}</td>
    <td>{{ s[3] }}</td>
    <td>

        <a class="btn edit" href="/edit/{{ s[0] }}">Edit</a>
        <a class="btn delete" href="/delete/{{ s[0] }}">Delete</a>
        <a class="btn present" href="/attendance/{{ s[0] }}/present">Present</a>
        <a class="btn absent" href="/attendance/{{ s[0] }}/absent">Absent</a>

    </td>
</tr>

{% endfor %}

</table>

<!-- SEARCH SCRIPT -->
<script>
document.getElementById("search").addEventListener("keyup", function(){

    let value = this.value.toLowerCase();
    let rows = document.querySelectorAll("#table tr");

    rows.forEach((row, index) => {
        if(index === 0) return;

        let text = row.innerText.toLowerCase();
        row.style.display = text.includes(value) ? "" : "none";
    });

});
</script>

</body>
</html>
