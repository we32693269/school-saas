<h2>Dashboard</h2>

<p>Role: {{ role }}</p>

<a href="/theme/dark">🌙 Dark</a>
<a href="/theme/light">☀ Light</a>

<h3>Total Students: {{ total_students }}</h3>

<form action="/search">
    <input name="q">
    <button>Search</button>
</form>

{% if role in ["admin","teacher"] %}
<form action="/add" method="post" enctype="multipart/form-data">
    <input name="name">
    <input name="age">
    <input name="grade">
    <input type="file" name="image">
    <button>Add</button>
</form>
{% endif %}

<table border="1">
{% for s in students %}
<tr>
<td>{{ s[1] }}</td>
<td>{{ s[2] }}</td>
<td>{{ s[3] }}</td>

<td>
<a href="/edit/{{ s[0] }}">Edit</a>

{% if role == "admin" %}
<a href="/delete/{{ s[0] }}">Delete</a>
{% endif %}
</td>

</tr>
{% endfor %}
</table>
