<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between">
        <h2>🎓 School Dashboard</h2>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>

    <!-- STATS -->
    <div class="card p-3 my-3 text-center">
        <h5>Total Students</h5>
        <h2 class="text-primary">{{ total_students }}</h2>
    </div>

    <!-- SEARCH -->
    <div class="card p-3 mb-3">
        <form action="/search" method="GET" class="row g-2">

            <div class="col-md-9">
                <input type="text" name="q" class="form-control" placeholder="Search student">
            </div>

            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-primary w-100">Search</button>
                <a href="/dashboard" class="btn btn-secondary w-100">Reset</a>
            </div>

        </form>
    </div>

    <!-- ADD -->
    <div class="card p-3 mb-3">
        <form action="/add" method="POST" class="row g-2">

            <div class="col-md-4">
                <input class="form-control" name="name" placeholder="Name">
            </div>

            <div class="col-md-3">
                <input class="form-control" name="age" placeholder="Age">
            </div>

            <div class="col-md-3">
                <input class="form-control" name="grade" placeholder="Grade">
            </div>

            <div class="col-md-2">
                <button class="btn btn-success w-100">Add</button>
            </div>

        </form>
    </div>

    <!-- CHART -->
    <div class="card p-3 mb-3">
        <h5>Students by Grade</h5>
        <canvas id="gradeChart"></canvas>
    </div>

    <!-- TABLE -->
    <div class="card p-3">

        <table class="table table-striped">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Grade</th>
                <th>Actions</th>
            </tr>

            {% for student in students %}

            <tr>
                <td>{{ student[0] }}</td>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>
                <td>{{ student[3] }}</td>
                <td>
                    <a href="/delete/{{ student[0] }}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>

            {% endfor %}

        </table>

    </div>

</div>

<!-- CHART SCRIPT -->
<script>
    const ctx = document.getElementById('gradeChart');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: [
                {% for g in grade_data %}
                    "{{ g[0] }}",
                {% endfor %}
            ],
            datasets: [{
                label: 'Students',
                data: [
                    {% for g in grade_data %}
                        {{ g[1] }},
                    {% endfor %}
                ],
                backgroundColor: 'blue'
            }]
        }
    });
</script>

</body>
</html>
