<!DOCTYPE html>
<html>
<head>
    <title>School Dashboard</title>
</head>
<body>

<h1>📊 School Dashboard</h1>

<p>Welcome Admin 👋</p>

<hr>

<!-- ➕ ADD STUDENT -->
<h3>➕ Add Student</h3>

<form action="/add_student" method="POST">
    <input type="text" name="name" placeholder="Student Name" required><br><br>
    <input type="number" name="age" placeholder="Age" required><br><br>
    <input type="number" name="fee" placeholder="School Fee" required><br><br>
    <input type="number" name="paid" placeholder="Amount Paid" required><br><br>
    <button type="submit">Add Student</button>
</form>

<hr>

<!-- 📋 STUDENTS LIST -->
<h3>📋 Students List</h3>

<ul>
{% for s in students %}
    <li>
        👨‍🎓 {{ s[1] }}
        | Age: {{ s[2] }}
        | Fee: {{ s[3] }}
        | Paid: {{ s[4] }}

        <!-- BALANCE -->
        | Balance: {{ (s[3]|int) - (s[4]|int) }}

        <br><br>

        <!-- ATTENDANCE FORM -->
        <form action="/mark_attendance/{{ s[0] }}" method="POST">
            <select name="status">
                <option value="Present">🟢 Present</option>
                <option value="Absent">🔴 Absent</option>
                <option value="Late">🟡 Late</option>
            </select>

            <button type="submit">Save</button>
        </form>

        <br>

        <!-- ACTIONS -->
        <a href="/edit_student/{{ s[0] }}">✏️ Edit</a>
        |
        <a href="/delete_student/{{ s[0] }}"
           onclick="return confirm('Are you sure?')">
           🗑 Delete
        </a>
    </li>

    <hr>
{% endfor %}
</ul>

<br>
<a href="/attendance">📊 View Attendance Report</a>
<hr>

<!-- 🚪 LOGOUT -->
<a href="/">Logout</a>

</body>
</html>
