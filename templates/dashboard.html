<!DOCTYPE html>
<html>
<head>
    <title>School Dashboard</title>

    <style>

        body{
            font-family: Arial;
            background:#f1f5f9;
            margin:0;
            padding:0;
        }

        .navbar{
            background:#0f172a;
            color:white;
            padding:15px;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-right:15px;
        }

        .container{
            padding:20px;
        }

        .cards{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            text-align:center;
        }

        .form-box{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:30px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            padding:10px 15px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .add-btn{
            background:#2563eb;
            color:white;
            margin-top:10px;
        }

        table{
            width:100%;
            border-collapse: collapse;
            background:white;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        th{
            background:#1e293b;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            border:1px solid #ddd;
            text-align:center;
        }

        .present{
            background:green;
            color:white;
        }

        .absent{
            background:red;
            color:white;
        }

        .edit{
            background:orange;
            color:white;
        }

        .delete{
            background:black;
            color:white;
        }

    </style>

</head>

<body>

<div class="navbar">

    <a href="/dashboard">Dashboard</a>
    <a href="/reports">Reports</a>
    <a href="/profile">Profile</a>
    <a href="/settings">Settings</a>
    <a href="/logout">Logout</a>

</div>

<div class="container">

    <!-- CARDS -->

    <div class="cards">

        <div class="card">
            <h2>Total Students</h2>
            <h1>{{ students|length }}</h1>
        </div>

        <div class="card">
            <h2>Present</h2>
            <h1>{{ attendance|length }}</h1>
        </div>

        <div class="card">
            <h2>School System</h2>
            <h1>Active</h1>
        </div>

    </div>

    <!-- FORM -->

    <div class="form-box">

        <h2>Add Student</h2>

        <form method="POST" action="/add_student">

            <input type="text" name="name" placeholder="Student Name" required>

            <input type="text" name="age" placeholder="Age" required>

            <input type="text" name="grade" placeholder="Grade" required>

            <button class="add-btn" type="submit">
                Add Student
            </button>

        </form>

    </div>

    <!-- TABLE -->

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}

        <tr>

            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>

            <td>

                <a href="/attendance/{{ student[0] }}/present">
                    <button class="present">Present</button>
                </a>

                <a href="/attendance/{{ student[0] }}/absent">
                    <button class="absent">Absent</button>
                </a>

                <a href="/edit/{{ student[0] }}">
                    <button class="edit">Edit</button>
                </a>

                <a href="/delete/{{ student[0] }}">
                    <button class="delete">Delete</button>
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
