<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            font-family: Arial;
            background:#f4f6f9;
            margin:0;
        }

        .topbar{
            background:#2c3e50;
            color:white;
            padding:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .cards{
            display:flex;
            gap:15px;
            padding:20px;
            flex-wrap:wrap;
        }

        .card{
            flex:1;
            min-width:200px;
            padding:20px;
            border-radius:12px;
            color:white;
            box-shadow:0px 3px 10px rgba(0,0,0,0.2);
        }

        .green{background:#27ae60;}
        .blue{background:#2980b9;}
        .orange{background:#f39c12;}

        .container{
            padding:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            padding:10px;
            border:1px solid #ddd;
        }

        th{
            background:#34495e;
            color:white;
        }

        .btn{
            padding:5px 10px;
            text-decoration:none;
            border-radius:5px;
            color:white;
        }

        .edit{background:#f39c12;}
        .delete{background:#e74c3c;}
        .present{background:#27ae60;}
        .absent{background:#c0392b;}

    </style>
</head>

<body>

<div class="topbar">
    <h2>School Dashboard</h2>
    <div>
        👤 {{ user }} | <a href="/logout" style="color:white;">Logout</a>
    </div>
</div>

<!-- CARDS -->
<div class="cards">

    <div class="card green">
        <h3>Total Students</h3>
        <h1>{{ total_students }}</h1>
    </div>

    <div class="card blue">
        <h3>System Status</h3>
        <h1>Online</h1>
    </div>

    <div class="card orange">
        <h3>Role</h3>
        <h1>{{ role }}</h1>
    </div>

</div>

<!-- ADD STUDENT -->
<div class="container">

    <h3>Add Student</h3>

    <form action="/add" method="post">
        <input name="name" placeholder="Name">
        <input name="age" placeholder="Age">
        <input name="grade" placeholder="Grade">
        <button>Add</button>
    </form>

    <br>

    <!-- STUDENTS TABLE -->
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
            <th>Actions</th>
        </tr>

        {% for s in students %}
        <tr>
            <td>{{ s[1] }}</td>
            <td>{{ s[2] }}</td>
            <td>{{ s[3] }}</td>
            <td>

                <a class="btn edit" href="/edit/{{ s[0] }}">Edit</a>
                <a class="btn delete" href="/delete/{{ s[0] }}">Delete</a>

                <a class="btn present" href="/attendance/{{ s[0] }}/present">✔</a>
                <a class="btn absent" href="/attendance/{{ s[0] }}/absent">❌</a>

            </td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <!-- CHART -->
    <h3>Attendance Chart</h3>
    <canvas id="chart"></canvas>

</div>

<script>

const data = {{ attendance_data|tojson }};
const labels = data.map(x => x[0]);
const values = data.map(x => x[1]);

new Chart(document.getElementById("chart"), {
    type: "pie",
    data: {
        labels: labels,
        datasets: [{
            data: values,
            backgroundColor:["#27ae60","#e74c3c"]
        }]
    }
});

</script>

</body>
</html>
