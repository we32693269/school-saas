<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body{font-family:Arial;background:#f4f6f8;}
.card{background:white;padding:20px;border-radius:12px;margin:15px;}
.btn{background:#2563eb;color:white;padding:6px 10px;border-radius:6px;text-decoration:none;}
.btn-danger{background:red;}
.sidebar{width:200px;position:fixed;height:100%;background:#111827;color:white;padding:20px;}
.main{margin-left:220px;}
</style>

</head>

<body>

<div class="sidebar">
<h2>School SaaS</h2>
<a href="/dashboard">Dashboard</a><br>
<a href="/attendance">Attendance</a><br>
<a href="/logout">Logout</a>
</div>

<div class="main">

<div class="card">
<h2>Add Student</h2>

<form method="POST" enctype="multipart/form-data">
<input type="text" name="name" placeholder="Name" required><br>
<input type="text" name="age" placeholder="Age" required><br>
<input type="text" name="grade" placeholder="Grade" required><br>
<input type="file" name="photo"><br><br>

<button type="submit" class="btn">Add</button>
</form>
</div>

<div class="card">
<h2>Students List</h2>

<table border="1" width="100%">
<tr>
<th>ID</th>
<th>Photo</th>
<th>Name</th>
<th>Age</th>
<th>Grade</th>
<th>Actions</th>
</tr>

{% for s in students %}
<tr>
<td>{{s.id}}</td>
<td>
{% if s.photo %}
<img src="/static/uploads/{{s.photo}}" width="50">
{% endif %}
</td>
<td>{{s.name}}</td>
<td>{{s.age}}</td>
<td>{{s.grade}}</td>

<td>
<a class="btn" href="/student/{{s.id}}">Profile</a>
<a class="btn btn-danger" href="/delete/{{s.id}}">Delete</a>
</td>

</tr>
{% endfor %}

</table>

</div>

</div>

</body>
</html>
