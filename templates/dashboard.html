<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School SaaS Dashboard</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>🎓 School SaaS</h2>

    <a href="/">🏠 Dashboard</a>
    <a href="/profile">👤 Profile</a>
    <a href="/fees">💰 Fees</a>
    <a href="/timetable">📅 Timetable</a>
    <a href="/settings">⚙ Settings</a>
    <a href="/logout">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
        <h1>📊 Dashboard</h1>

        <button class="dark-btn" onclick="darkMode()">🌙 Dark</button>
    </div>

    <!-- CARDS -->
    <div class="cards">

        <div class="card">
            <h1>120</h1>
            <p>Total Students</p>
        </div>

        <div class="card">
            <h1>85</h1>
            <p>Present</p>
        </div>

        <div class="card">
            <h1>35</h1>
            <p>Absent</p>
        </div>

    </div>

    <!-- FORM -->
    <div class="form-box">
        <h2>Add Student</h2>

        <form method="POST">

            <input type="text" name="name" placeholder="Student Name" required>
            <input type="text" name="age" placeholder="Age" required>
            <input type="text" name="grade" placeholder="Grade" required>

            <button type="submit">Save Student</button>

        </form>
    </div>

    <!-- SEARCH -->
    <div class="search-box">
        <input type="text" placeholder="Search students...">
    </div>

    <!-- TABLE -->
    <div class="table-box">

        <table>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Grade</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Abel</td>
                <td>15</td>
                <td>10</td>
                <td>Present</td>
                <td>
                    <a href="#" class="btn edit">Edit</a>
                    <a href="#" class="btn delete">Delete</a>
                    <a href="#" class="btn present">Present</a>
                    <a href="#" class="btn absent">Absent</a>
                </td>
            </tr>

        </table>

    </div>

    <!-- PDF -->
    <br>
    <a href="/download_pdf" class="pdf-btn">⬇ Download PDF Report</a>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 School SaaS System
    </div>

</div>

<!-- DARK MODE SCRIPT -->
<script>
function darkMode(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
