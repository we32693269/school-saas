<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">🏫 School SaaS Dashboard</h2>

    <!-- STATS CARDS -->
    <div class="row">

        <div class="col-md-3">
            <div class="card bg-primary text-white shadow p-3 text-center">
                <h5>👨‍🎓 Students</h5>
                <h2>{{students}}</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-success text-white shadow p-3 text-center">
                <h5>👨‍🏫 Teachers</h5>
                <h2>{{teachers}}</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-warning text-white shadow p-3 text-center">
                <h5>📅 Attendance</h5>
                <h2>{{attendance}}</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-danger text-white shadow p-3 text-center">
                <h5>💳 Payments</h5>
                <h2>{{payments}}</h2>
            </div>
        </div>

    </div>

    <hr>

    <!-- MENU -->
    <div class="row">

        <div class="col-md-4">
            <a href="/list" class="btn btn-outline-primary w-100 mb-2">👨‍🎓 Students</a>
        </div>

        <div class="col-md-4">
            <a href="/teachers" class="btn btn-outline-success w-100 mb-2">👨‍🏫 Teachers</a>
        </div>

        <div class="col-md-4">
            <a href="/attendance_report" class="btn btn-outline-warning w-100 mb-2">📅 Attendance</a>
        </div>

        <div class="col-md-4">
            <a href="/ranking" class="btn btn-outline-dark w-100 mb-2">🏆 Ranking</a>
        </div>

        <div class="col-md-4">
            <a href="/payment" class="btn btn-outline-info w-100 mb-2">💳 Payment System</a>
        </div>

        <div class="col-md-4">
            <a href="/payments" class="btn btn-outline-danger w-100 mb-2">📋 Payments Report</a>
        </div>

    </div>

    <hr>

    <a href="/logout" class="btn btn-secondary">🚪 Logout</a>

</div>

</body>
</html>
