<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h2>🎓 School Dashboard</h2>
        <a class="btn btn-danger" href="/logout">Logout</a>
    </div>

    <hr>
<form action="/search" method="GET" class="mb-3">

    <input type="text" name="q" placeholder="Search student name..." class="form-control" required>

    <br>

    <button class="btn btn-primary">Search</button>

</form>
    <!-- ADD STUDENT CARD -->
    <div class="card p-3 mb-4">
        <h5>Add Student</h5>

        <form action="/add" method="POST" class="row g-2">

            <div class="col-md-4">
                <input class="form-control" type="text" name="name" placeholder="Name" required>
            </div>

            <div class="col-md-3">
                <input class="form-control" type="text" name="age" placeholder="Age" required>
            </div>

            <div class="col-md-3">
                <input class="form-control" type="text" name="grade" placeholder="Grade" required>
            </div>

            <div class="col-md-2">
                <button class="btn btn-success w-100">Add</button>
            </div>

        </form>
    </div>

    <!-- STUDENTS TABLE -->
    <div class="card p-3">

        <h5>Students List</h5>

        <table class="table table-striped">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Grade</th>
                <th>Actions</th>
            </tr>

            {% for student in students %}

            <tr>
                <td>{{ student[0] }}</td>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>
                <td>{{ student[3] }}</td>
                <td>

                    <a class="btn btn-sm btn-primary" href="/edit/{{ student[0] }}">Edit</a>

                    <a class="btn btn-sm btn-danger" href="/delete/{{ student[0] }}">Delete</a>

                </td>
            </tr>

            {% endfor %}

        </table>

    </div>

</div>

</body>
</html>
