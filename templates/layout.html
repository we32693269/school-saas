<!DOCTYPE html>
<html>
<head>
    <title>School SaaS Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
        }

        .sidebar{
            width:250px;
            height:100vh;
            position:fixed;
            left:0;
            top:0;
            background:#212529;
            padding-top:20px;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:12px 20px;
        }

        .sidebar a:hover{
            background:#343a40;
        }

        .content{
            margin-left:260px;
            padding:20px;
        }

        .brand{
            color:white;
            text-align:center;
            margin-bottom:20px;
        }
    </style>

</head>

<body>

<div class="sidebar">

    <h3 class="brand">🏫 School SaaS</h3>

    <a href="/dashboard">📊 Dashboard</a>

    <a href="/students">👨‍🎓 Students</a>

    <a href="/teachers">👨‍🏫 Teachers</a>

    <a href="/attendance_report">📅 Attendance</a>

    <a href="/ranking">🏆 Ranking</a>

    <a href="/payments">💳 Payments</a>

    <a href="/income">💰 Income</a>

    <a href="/fees_status">📋 Fees Status</a>

    <a href="/logout">🚪 Logout</a>

</div>

<div class="content">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
