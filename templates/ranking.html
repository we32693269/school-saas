<!DOCTYPE html>
<html>
<head>
    <title>Student Ranking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2>🏆 Student Ranking</h2>

    <a href="/dashboard" class="btn btn-secondary mb-3">
        ⬅ Dashboard
    </a>

    <div class="card shadow p-3">

        <table class="table table-striped">

            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Student</th>
                    <th>Average Score</th>
                </tr>
            </thead>

            <tbody>

            {% for student in ranking %}

                <tr>

                    <td>
                        {% if loop.index == 1 %}
                            🥇
                        {% elif loop.index == 2 %}
                            🥈
                        {% elif loop.index == 3 %}
                            🥉
                        {% else %}
                            {{ loop.index }}
                        {% endif %}
                    </td>

                    <td>{{ student[0] }}</td>

                    <td>{{ "%.2f"|format(student[1]) }}</td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
