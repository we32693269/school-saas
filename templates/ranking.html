<!DOCTYPE html>
<html>
<head>
    <title>🏆 Student Ranking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .card{
            border-radius:15px;
            border:none;
        }

        table{
            background:white;
        }

        .gold{
            color:gold;
            font-weight:bold;
        }

        .silver{
            color:silver;
            font-weight:bold;
        }

        .bronze{
            color:#cd7f32;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <div class="card shadow p-3 mb-3">

        <h2>🏆 Student Ranking System</h2>

        <a href="/dashboard" class="btn btn-primary btn-sm">
            ⬅ Back Dashboard
        </a>

    </div>

    <div class="card shadow p-3">

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

                <tr>
                    <th>Rank</th>
                    <th>Student Name</th>
                    <th>Average GPA</th>
                </tr>

            </thead>

            <tbody>

            {% for s in students %}

            <tr>

                <td>

                    {% if loop.index == 1 %}
                        <span class="gold">🥇 1st</span>

                    {% elif loop.index == 2 %}
                        <span class="silver">🥈 2nd</span>

                    {% elif loop.index == 3 %}
                        <span class="bronze">🥉 3rd</span>

                    {% else %}
                        {{ loop.index }}
                    {% endif %}

                </td>

                <td>{{ s.name }}</td>

                <td>{{ s.gpa }}</td>

            </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
