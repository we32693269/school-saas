<!DOCTYPE html>
<html>
<head>
    <title>Student Exams</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

<h2>🎓 {{ student[1] }} Exam Results</h2>
<h4>📊 Average GPA: {{ avg_gpa|round(2) }}</h4>

<form method="POST" action="/add_exam/{{ student[0] }}">
    <div class="row">

        <div class="col">
            <input type="text" name="subject" class="form-control" placeholder="Subject" required>
        </div>

        <div class="col">
            <input type="text" name="exam_name" class="form-control" placeholder="Exam Name" required>
        </div>

        <div class="col">
            <input type="number" name="score" class="form-control" placeholder="Score" required>
        </div>

        <div class="col">
            <input type="number" name="total" class="form-control" placeholder="Total" required>
        </div>

        <div class="col">
            <button class="btn btn-success">Add</button>
        </div>

    </div>
</form>

<hr>

<table class="table table-bordered">

<tr>
    <th>Subject</th>
    <th>Exam</th>
    <th>Score</th>
    <th>Total</th>
    <th>Grade</th>
</tr>

{% for e in exams %}
<tr>
    <td>{{ e[0] }}</td>
    <td>{{ e[1] }}</td>
    <td>{{ e[2] }}</td>
    <td>{{ e[3] }}</td>
    <td>{{ e[4] }}</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
