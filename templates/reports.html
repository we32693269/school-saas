<!DOCTYPE html>
<html>

<head>
    <title>Reports</title>

    <style>

        body{
            font-family: Arial;
            background:#f1f5f9;
            padding:20px;
        }

        h1{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse: collapse;
            background:white;
            margin-top:20px;
        }

        th{
            background:#0f172a;
            color:white;
            padding:10px;
        }

        td{
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
        }

        a{
            background:#0f172a;
            color:white;
            padding:10px;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>

<body>

<h1>Reports</h1>

<a href="/dashboard">Back Dashboard</a>

<h2>Students Report</h2>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Grade</th>
</tr>

{% for s in students %}

<tr>
    <td>{{ s[0] }}</td>
    <td>{{ s[1] }}</td>
    <td>{{ s[2] }}</td>
    <td>{{ s[3] }}</td>
</tr>

{% endfor %}

</table>

<h2>Attendance Report</h2>

<table>

<tr>
    <th>ID</th>
    <th>Student ID</th>
    <th>Status</th>
    <th>Date</th>
</tr>

{% for a in attendance %}

<tr>
    <td>{{ a[0] }}</td>
    <td>{{ a[1] }}</td>
    <td>{{ a[2] }}</td>
    <td>{{ a[3] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
