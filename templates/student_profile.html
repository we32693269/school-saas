<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body{
            background:#f1f5f9;
            font-family:Arial;
        }

        .card{
            width:400px;
            margin:auto;
            margin-top:50px;
            background:white;
            padding:20px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        img{
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
        }

        .btn{
            background:#2563eb;
            color:white;
            padding:10px 15px;
            border-radius:8px;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="card">

    {% if student[4] %}
    <img src="{{ url_for('static', filename='uploads/' + student[4]) }}">
    {% endif %}

    <h2>{{ student[1] }}</h2>

    <p><strong>Age:</strong> {{ student[2] }}</p>

    <p><strong>Grade:</strong> {{ student[3] }}</p>

    <br>

    <a href="/dashboard" class="btn">
        ⬅ Back Dashboard
    </a>

</div>

</body>
</html>
