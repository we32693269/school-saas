<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f6f8;
            padding:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:12px;
            width:400px;
            margin:auto;
            text-align:center;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        img{
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
            border:3px solid #2563eb;
        }

        h2{
            margin-top:10px;
        }

        .info{
            text-align:left;
            margin-top:20px;
        }

        .info p{
            padding:8px;
            border-bottom:1px solid #eee;
        }

        .back{
            display:inline-block;
            margin-top:15px;
            padding:10px 15px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }
    </style>
</head>

<body>

<div class="card">

    <!-- PHOTO -->
    {% if student[4] %}
    <img src="{{ url_for('static', filename='uploads/' + student[4]) }}">
{% else %}
    <img src="https://via.placeholder.com/120">
{% endif %}

    <!-- NAME -->
    <h2>{{ student[1] }}</h2>

    <div class="info">
        <p><b>ID:</b> {{ student[0] }}</p>
        <p><b>Age:</b> {{ student[2] }}</p>
        <p><b>Grade:</b> {{ student[3] }}</p>
        <p><b>Status:</b> Active</p>
    </div>

    <a href="/dashboard" class="back">⬅ Back to Dashboard</a>

</div>

</body>
</html>
