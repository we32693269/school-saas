<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <a href="/list" class="btn btn-secondary mb-3">⬅ Back</a>

    <div class="row">

        <!-- PROFILE CARD -->
        <div class="col-md-4">

            <div class="card shadow p-3 text-center">

                <img src="/static/uploads/{{student.photo}}"
                     width="150"
                     height="150"
                     style="border-radius:50%; object-fit:cover; margin:auto;">

                <h3 class="mt-3">{{student.name}}</h3>

                <p>Grade: {{student.grade}}</p>

                <a href="/upload_photo/{{student.id}}" class="btn btn-primary w-100 mb-2">
                    📷 Upload Photo
                </a>

                <a href="/pay/{{student.id}}" class="btn btn-success w-100">
                    💳 Pay Fees
                </a>

            </div>

        </div>

        <!-- DETAILS -->
        <div class="col-md-8">

            <!-- STATS -->
            <div class="row">

                <div class="col-md-4">
                    <div class="card bg-primary text-white p-3 text-center">
                        <h5>📝 Marks</h5>
                        <h3>{{marks_count}}</h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card bg-success text-white p-3 text-center">
                        <h5>📅 Present</h5>
                        <h3>{{present_count}}</h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card bg-danger text-white p-3 text-center">
                        <h5>❌ Absent</h5>
                        <h3>{{absent_count}}</h3>
                    </div>
                </div>

            </div>

            <br>

            <!-- MARKS TABLE -->
            <div class="card p-3 shadow">

                <h5>📊 Marks History</h5>

                <table class="table table-striped">

                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Score</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for m in marks %}
                        <tr>
                            <td>{{m[0]}}</td>
                            <td>{{m[1]}}</td>
                        </tr>
                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
