<!DOCTYPE html>
<html>
<head>
    <title>Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>👨‍🎓 Students Management</h2>

    <!-- ADD STUDENT FORM -->
    <div class="card p-3 mb-4 shadow">

        <h5>Add Student</h5>

        <form action="/add" method="post">

            <input class="form-control mb-2" name="name" placeholder="Student Name" required>

            <input class="form-control mb-2" name="grade" placeholder="Grade" required>

            <button class="btn btn-primary">➕ Add Student</button>

        </form>

    </div>

    <!-- STUDENT LIST -->
    <div class="card p-3 shadow">

        <h5>Student List</h5>

        {% for s in students %}

        <div class="border p-2 mb-2">

            <b>{{s[1]}}</b> - Grade: {{s[2]}}

            <div class="mt-2">

                <a class="btn btn-sm btn-warning" href="/edit/{{s[0]}}">✏️ Edit</a>

                <a class="btn btn-sm btn-danger" href="/delete/{{s[0]}}">🗑️ Delete</a>

                <a class="btn btn-sm btn-success" href="/attendance/{{s[0]}}/Present">✅ Present</a>

                <a class="btn btn-sm btn-secondary" href="/attendance/{{s[0]}}/Absent">❌ Absent</a>

                <a class="btn btn-sm btn-info" href="/marks/{{s[0]}}">📝 Marks</a>

                <a class="btn btn-sm btn-dark" href="/student_profile/{{s[0]}}">👤 Profile</a>

                <a class="btn btn-sm btn-primary" href="/pay/{{s[0]}}">💳 Pay</a>

            </div>

        </div>

        {% endfor %}

    </div>

    <br>

    <a href="/dashboard" class="btn btn-secondary">🏠 Back to Dashboard</a>

</div>

</body>
</html>
