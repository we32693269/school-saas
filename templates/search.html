<!DOCTYPE html>
<html>
<head>
    <title>Search Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2>🔍 Search Student</h2>

<form method="POST">
    <input name="keyword" class="form-control mb-2" placeholder="Enter student name">
    <button class="btn btn-primary w-100">Search</button>
</form>

<hr>

<table class="table table-bordered">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Grade</th>
        <th>Attendance</th>
    </tr>
    <a href="/dashboard" class="btn btn-secondary mt-3">
    ⬅ Back to Home
</a>
{% for s in students %}
    <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.age }}</td>
        <td>{{ s.grade }}</td>
        <td>{{ s.attendance }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
