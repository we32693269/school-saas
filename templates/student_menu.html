<!DOCTYPE html>
<html>
<head>
<title>Student Menu</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-4">

<h2>👨‍🎓 {{ student[1] }}</h2>

<div class="list-group">

<a href="/student/{{ student[0] }}"
class="list-group-item">
👁 View Student
</a>

<a href="/edit_student/{{ student[0] }}"
class="list-group-item">
✏ Edit Student
</a>

<a href="/student_exams/{{ student[0] }}"
class="list-group-item">
🎓 Exams & Grades
</a>

<a href="/receipt/{{ student[0] }}"
class="list-group-item">
🧾 Receipt
</a>

<a href="/id_card/{{ student[0] }}"
class="list-group-item">
🆔 ID Card
</a>

<a href="/delete_student/{{ student[0] }}"
class="list-group-item text-danger">
🗑 Delete Student
</a>

</div>

</div>

</body>
</html>
