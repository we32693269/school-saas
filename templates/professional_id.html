<!DOCTYPE html>
<html>
<head>
    <title>Professional ID Card</title>

    <style>

        body{
            background:#f0f2f5;
            font-family:Arial, sans-serif;
        }

        .card{
            width:380px;
            margin:30px auto;
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        .header{
            background:#0d6efd;
            color:white;
            text-align:center;
            padding:15px;
        }

        .logo{
            width:70px;
            margin-bottom:10px;
        }

        .content{
            padding:20px;
            text-align:center;
        }

        .photo{
            width:120px;
            height:120px;
            border-radius:50%;
            border:4px solid #0d6efd;
            object-fit:cover;
        }

        .name{
            font-size:24px;
            font-weight:bold;
            margin-top:10px;
        }

        .info{
            font-size:18px;
            margin:8px;
        }

        .footer{
            background:#0d6efd;
            color:white;
            text-align:center;
            padding:10px;
        }

    </style>

</head>
<body>

<div class="card">

    <div class="header">

        <img src="/static/logo.png"
             class="logo">

        <h2>MY SCHOOL</h2>

        <h4>Professional Student ID Card</h4>

    </div>

    <div class="content">

        {% if student[7] %}
        <img src="/static/uploads/{{ student[7] }}"
             class="photo">
        {% else %}
        <img src="/static/logo.png"
             class="photo">
        {% endif %}

        <div class="name">
            {{ student[1] }}
        </div>

        <hr>

        <div class="info">
            🆔 ID : {{ student[0] }}
        </div>

        <div class="info">
            🎓 Grade : {{ student[3] }}
        </div>

        <div class="info">
            🎂 Age : {{ student[2] }}
        </div>

        <div class="info">
            💰 Fee : {{ student[4] }}
        </div>

        <div class="info">
            ✅ Paid : {{ student[5] }}
        </div>

    </div>

    <div class="footer">

        School Management System

    </div>

</div>

</body>
</html>
