<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2>⚙️ School Settings</h2>

<form method="POST">

    <label>School Name</label>
    <input type="text" name="school_name"
           value="{{ settings[1] }}"
           class="form-control">

    <br>

    <label>Default Fee</label>
    <input type="number" name="default_fee"
           value="{{ settings[3] }}"
           class="form-control">

    <br>

    <button class="btn btn-success">
        Save Settings
    </button>

</form>

<hr>

<h4>ℹ System Info</h4>

<p><b>Logo:</b> {{ settings[2] }}</p>
<p><b>Admin Password:</b> ******</p>

</body>
</html>
