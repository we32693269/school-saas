<!DOCTYPE html>
<html>
<head>
    <title>School Settings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>⚙️ School Settings</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>School Name</label>
                    <input
                        type="text"
                        name="school_name"
                        class="form-control"
                        value="{{ settings[1] }}"
                    >
                </div>

                <div class="mb-3">
                    <label>Default Fee</label>
                    <input
                        type="number"
                        name="default_fee"
                        class="form-control"
                        value="{{ settings[3] }}"
                    >
                </div>

                <div class="mb-3">
                    <label>School Phone</label>
                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                    >
                </div>

                <div class="mb-3">
                    <label>School Email</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                    >
                </div>

                <div class="mb-3">
                    <label>School Address</label>
                    <textarea
                        name="address"
                        class="form-control"
                        rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label>Receipt Footer Message</label>
                    <input
                        type="text"
                        name="footer_message"
                        class="form-control"
                        value="Thank you for your payment"
                    >
                </div>

                <button class="btn btn-success">
                    💾 Save Settings
                </button>

                <a href="/dashboard" class="btn btn-secondary">
                    ⬅ Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
