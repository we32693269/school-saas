<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">⚙️ School Settings</h2>

        <!-- SETTINGS FORM -->
        <form method="POST">

            <div class="mb-3">
                <label class="form-label">School Name</label>
                <input type="text"
                       name="school_name"
                       value="{{ settings[1] }}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Default Fee</label>
                <input type="number"
                       name="default_fee"
                       value="{{ settings[3] }}"
                       class="form-control"
                       required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                💾 Save Settings
            </button>

        </form>

    </div>

    <!-- SYSTEM INFO -->
    <div class="card mt-4 p-3 shadow">

        <h5>ℹ System Info</h5>

        <p><b>School Name:</b> {{ settings[1] }}</p>
        <p><b>Logo Path:</b> {{ settings[2] }}</p>
        <p><b>Default Fee:</b> {{ settings[3] }}</p>

        <p class="text-muted">Admin password is hidden 🔒</p>

    </div>

</div>

</body>
</html>
