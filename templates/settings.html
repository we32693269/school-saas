<form method="POST">

<h3>🏫 School Profile</h3>
<input name="school_name" value="{{ settings[1] }}" class="form-control">

<h3>💰 Fee Settings</h3>
<input name="default_fee" value="{{ settings[3] }}" class="form-control">

<h3>👨‍💼 Admin</h3>
<input name="admin_password" value="{{ settings[4] }}" class="form-control">

<h3>📚 Academic Year</h3>
<input name="academic_year" value="{{ settings[5] }}" class="form-control">

<h3>📞 Phone</h3>
<input name="phone" value="{{ settings[6] }}" class="form-control">

<h3>📧 Email</h3>
<input name="email" value="{{ settings[7] }}" class="form-control">

<h3>🔐 Email Password</h3>
<input name="email_password" value="{{ settings[8] }}" class="form-control">

<h3>🔔 SMS API</h3>
<input name="sms_api_key" value="{{ settings[9] }}" class="form-control">

<h3>🧾 Footer</h3>
<input name="footer_message" value="{{ settings[10] }}" class="form-control">

<button class="btn btn-success mt-3">Save Settings</button>

</form>
