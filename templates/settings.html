<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">⚙️ School Settings</h2>

        <form method="POST">

            <!-- 🏫 School Name -->
            <div class="mb-3">
                <label>🏫 School Name</label>
                <input type="text" name="school_name" class="form-control"
                       value="{{ settings[1] }}">
            </div>

            <!-- 💰 Fee -->
            <div class="mb-3">
                <label>💰 Default Fee</label>
                <input type="number" name="default_fee" class="form-control"
                       value="{{ settings[3] }}">
            </div>

            <!-- 👨‍💼 Admin Password -->
            <div class="mb-3">
                <label>🔐 Admin Password</label>
                <input type="text" name="admin_password" class="form-control"
                       value="{{ settings[4] }}">
            </div>

            <!-- 📚 Academic Year -->
            <div class="mb-3">
                <label>📚 Academic Year</label>
                <input type="text" name="academic_year" class="form-control"
                       value="{{ settings[5] }}">
            </div>

            <!-- 📞 Phone -->
            <div class="mb-3">
                <label>📞 Phone</label>
                <input type="text" name="phone" class="form-control"
                       value="{{ settings[6] }}">
            </div>

            <!-- 📧 Email -->
            <div class="mb-3">
                <label>📧 Email</label>
                <input type="email" name="email" class="form-control"
                       value="{{ settings[7] }}">
            </div>

            <!-- 🔐 Email Password -->
            <div class="mb-3">
                <label>🔐 Email Password</label>
                <input type="password" name="email_password" class="form-control"
                       value="{{ settings[8] }}">
            </div>

            <!-- 🔔 SMS API -->
            <div class="mb-3">
                <label>🔔 SMS API Key</label>
                <input type="text" name="sms_api_key" class="form-control"
                       value="{{ settings[9] }}">
            </div>

            <!-- 🧾 Footer -->
            <div class="mb-3">
                <label>🧾 Receipt Footer Message</label>
                <input type="text" name="footer_message" class="form-control"
                       value="{{ settings[10] }}">
            </div>

            <!-- 💾 SAVE BUTTON -->
            <button type="submit" class="btn btn-success w-100">
                💾 Save Settings
            </button>

        </form>

    </div>

</div>

</body>
</html>
