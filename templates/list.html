<!DOCTYPE html>
<html>
<head>
    <title>Students List</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>Students List</h2>
    <a href="/home">Back</a>
</div>

<!-- TABLE -->
<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Class</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Photo</th>
    </tr>

    {% for s in students %}
    <tr>
        <td>{{ s[0] }}</td>
        <td>{{ s[1] }}</td>
        <td>{{ s[2] }}</td>
        <td>{{ s[3] }}</td>
        <td>{{ s[4] }}</td>
        <td>
            {% if s[5] %}
                <img src="{{ url_for('static', filename='uploads/' + s[5]) }}"
                     width="50" height="50"
                     style="border-radius:50%;">
            {% else %}
                No Photo
            {% endif %}
        </td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
