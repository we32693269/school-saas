<!DOCTYPE html>
<html>
<head>
    <title>Students List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Students Table</h1>

<table border="1" style="margin:auto; background:white;">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Class</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Action</th>
    </tr>

    {% for s in students %}
    <tr>
        <td>{{ s[0] }}</td>
        <td>{{ s[1] }}</td>
        <td>{{ s[2] }}</td>
        <td>{{ s[3] }}</td>
        <td>{{ s[4] }}</td>
        <td>
            <a href="/edit/{{ s[0] }}">Edit</a>
            <a href="/delete/{{ s[0] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}

</table>

<br>
<a href="/home">Back</a>

</body>
</html>
