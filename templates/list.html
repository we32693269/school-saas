<!DOCTYPE html>
<html>
<head>
    <title>Students List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h2>Students List</h2>

{% for student in students %}
<p>
    {{ student[0] }}. {{ student[1] }}

    <a href="/delete/{{ student[0] }}">🗑️ Delete</a>
</p>
{% endfor %}

<a href="/home">Back</a>

</body>
</html>
