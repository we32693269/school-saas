<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4 text-center">

                <h3>💳 School Fee Payment</h3>

                <hr>

                <h5>Student: {{student_name}}</h5>

                <p class="text-muted">Pay your school fees securely via Stripe</p>

                <h2 class="text-success">${{amount}}</h2>

                <hr>

                <!-- CHECKOUT BUTTON -->
                <a href="{{checkout_url}}" class="btn btn-primary btn-lg w-100">
                    🚀 Pay Now
                </a>

                <br><br>

                <a href="/dashboard" class="btn btn-secondary w-100">
                    ⬅ Back
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
