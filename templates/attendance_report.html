<!DOCTYPE html>
<html>
<head>
    <title>Attendance Report</title>
</head>
<body>

<h2>Attendance Report</h2>

<a href="/attendance">
    Back
</a>

<table border="1">

<tr>
    <th>Name</th>
    <th>Status</th>
    <th>Date</th>
</tr>

{% for r in records %}
<tr>
    <td>{{ r.student_name }}</td>
    <td>{{ r.status }}</td>
    <td>{{ r.date }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
