<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f5f6fa;
        }

        .container{
            width:90%;
            max-width:700px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            margin-bottom:20px;
            color:#2c3e50;
        }

        .card{
            background:#ecf0f1;
            padding:20px;
            border-radius:10px;
            margin-top:20px;
        }

        .card p{
            margin:15px 0;
            font-size:18px;
        }

        .btn{
            display:inline-block;
            margin-top:20px;
            padding:12px 20px;
            background:#2c3e50;
            color:white;
            text-decoration:none;
            border-radius:6px;
        }

        .btn:hover{
            background:#34495e;
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>User Profile</h1>

        <div class="card">

            <p>
                <strong>Username:</strong>
                {{ user.username }}
            </p>

            <p>
                <strong>Role:</strong>
                {{ user.role }}
            </p>

            <p>
                <strong>Status:</strong>
                Active
            </p>

        </div>

        <a href="/dashboard" class="btn">
            Back Dashboard
        </a>

    </div>

</body>
</html>
