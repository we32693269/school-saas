<!DOCTYPE html>
<html>
<head>
    <title>Receipt</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }

        .receipt {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border: 2px dashed #333;
        }
    </style>
</head>

<body>

<div class="receipt">

    <!-- SCHOOL HEADER -->
    <div style="text-align:center; margin-bottom:15px;">
        <h2>🏫 Bright Future School</h2>
        <p>📞 09xxxxxxxx</p>
        <p>📍 Addis Ababa</p>
        <hr>
        <h3>🧾 Receipt</h3>
    </div>

    <!-- RECEIPT NUMBER -->
    <p><b>Receipt No:</b> R-{{ "%04d"|format(student[0]) }}</p>

    <hr>

    <!-- STUDENT INFO -->
    <div><b>Name:</b> {{ student[1] }}</div>
    <div><b>Age:</b> {{ student[2] }}</div>
    <div><b>Grade:</b> {{ student[3] }}</div>

    <hr>

    <!-- PAYMENT -->
    <div><b>Total Fee:</b> {{ student[4] }}</div>
    <div><b>Paid:</b> {{ student[5] }}</div>
    <div><b>Balance:</b> {{ student[4] - student[5] }}</div>

    <hr>

    <p style="text-align:center;">Thank you 🙏</p>

    <button onclick="window.print()">🖨 Print</button>

</div>

</body>
</html>
