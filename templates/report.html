<!DOCTYPE html>
<html>
<head>
    <title>Reports</title>

    <style>

        body{
            font-family: Arial;
            background:#f1f5f9;
            margin:0;
            padding:20px;
        }

        h1{
            text-align:center;
        }

        a{
            text-decoration:none;
            color:white;
            background:#0f172a;
            padding:10px;
            border-radius:5px;
        }

        table{
            width:100%;
            border-collapse: collapse;
            background:white;
            margin-top:20px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        th{
            background:#1e293b;
            color:white;
            padding:10px;
        }

        td{
            padding:10px;
            border:1px solid #ddd;
            text-align:center;
        }

        .section{
            margin-top:40px;
        }

    </style>

</head>

<body>

<h1>School Reports</h1>

<a href="/dashboard">⬅ Back Dashboard</a>

<!-- STUDENTS REPORT -->
<div class="section">

    <h2>Students Report</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
        </tr>

        {% for s in students %}

        <tr>
            <td>{{ s[0] }}</td>
            <td>{{ s[1] }}</td>
            <td>{{ s[2] }}</td>
            <td>{{ s[3] }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

<!-- ATTENDANCE REPORT -->
<div class="section">

    <h2>Attendance Report</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>Student ID</th>
            <th>Status</th>
            <th>Date</th>
        </tr>

        {% for a in attendance %}

        <tr>
            <td>{{ a[0] }}</td>
            <td>{{ a[1] }}</td>
            <td>{{ a[2] }}</td>
            <td>{{ a[3] }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
