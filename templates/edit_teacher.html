<!DOCTYPE html>
<html>
<head>
    <title>Edit Teacher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .card{
            border:none;
            border-radius:15px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h3>✏️ Edit Teacher</h3>

        <form method="POST">

            <!-- NAME -->
            <label>Name</label>
            <input type="text" name="name" class="form-control mb-2"
                   value="{{ teacher[1] }}" required>

            <!-- SUBJECT -->
            <label>Subject</label>
            <input type="text" name="subject" class="form-control mb-2"
                   value="{{ teacher[2] }}" required>

            <!-- PHONE -->
            <label>Phone</label>
            <input type="text" name="phone" class="form-control mb-2"
                   value="{{ teacher[3] }}" required>

            <!-- SALARY -->
            <label>Salary</label>
            <input type="number" name="salary" class="form-control mb-3"
                   value="{{ teacher[4] }}" required>

            <button class="btn btn-success w-100">
                Update Teacher
            </button>

        </form>

        <br>

        <a href="/teachers" class="btn btn-secondary w-100">
            ⬅ Back
        </a>

    </div>

</div>

</body>
</html>
