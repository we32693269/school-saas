<!DOCTYPE html>
<html>
<head>
    <title>School SaaS Dashboard</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f1f5f9;
        }

        .sidebar{
            position:fixed;
            width:220px;
            height:100%;
            background:#0f172a;
            color:white;
            padding:20px;
        }

        .sidebar h2{
            color:#38bdf8;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            margin:15px 0;
        }

        .main{
            margin-left:240px;
            padding:20px;
        }

        .cards{
            display:flex;
            gap:15px;
            flex-wrap:wrap;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:12px;
            width:200px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        .card h1{
            margin:0;
            color:#2563eb;
        }

        input{
            padding:10px;
            margin:5px;
            border-radius:6px;
            border:1px solid #ccc;
        }

        button{
            padding:10px 15px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }

        table{
            width:100%;
            margin-top:20px;
            background:white;
            border-collapse:collapse;
            border-radius:10px;
            overflow:hidden;
        }

        th,td{
            padding:12px;
            border-bottom:1px solid #eee;
            text-align:left;
        }

        th{
            background:#e2e8f0;
        }

        .action a{
            text-decoration:none;
            margin-right:10px;
        }

    </style>
</head>

<body>

<div class="sidebar">

    <h2>🎓 School SaaS</h2>

    <a href="/dashboard">📊 Dashboard</a>
    <a href="#">👨‍🎓 Students</a>
    <a href="#">⚙ Settings</a>
    <a href="/logout">🚪 Logout</a>

</div>

<div class="main">

    <h1>📊 Admin Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <h1>{{students|length}}</h1>
        </div>

        <div class="card">
            <h3>Teachers</h3>
            <h1>10</h1>
        </div>

        <div class="card">
            <h3>Classes</h3>
            <h1>5</h1>
        </div>

    </div>

    <br>

    <h2>Add Student</h2>

    <form method="POST" action="/add">

        <input name="name" placeholder="Student Name">

        <input name="age" placeholder="Age">

        <input name="grade" placeholder="Grade">

        <button>Add Student</button>

    </form>

    <h2>Student List</h2>

    <table>

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
            <th>Action</th>
        </tr>

        {% for s in students %}

        <tr>

            <td>{{s[1]}}</td>
            <td>{{s[2]}}</td>
            <td>{{s[3]}}</td>

            <td class="action">

                <a href="/edit/{{s[0]}}">✏ Edit</a>

                <a href="/delete/{{s[0]}}">🗑 Delete</a>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
